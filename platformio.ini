[env:esp32dev]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino

; Bibliotecas
lib_deps = 
    ; Sensores e controle
    milesburton/DallasTemperature@3.11.0
    paulstoffregen/OneWire@2.3.7
    br3ttb/PID@1.2.1
    ayushsharma82/ElegantOTA @ ^3.1.5  
    ; MQTT e WiFi
    256dpi/MQTT@2.5.2
    tzapu/WiFiManager@2.0.17

; Configuracao
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Empacota dist/hvac-<versao>.bin + SHA-256 depois de cada build (OTA remoto via MQTT)
extra_scripts = post:scripts/publicar_ota.py

monitor_port = COM4
upload_port = COM4

build_flags = 
    -D ARDUINO_ARCH_ESP32